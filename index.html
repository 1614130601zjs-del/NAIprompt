<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NAI Prompt Translator</title>
<style>
:root{--bg:#f5f3ef;--card:#fff;--ink:#171717;--muted:#777;--line:#ddd7cf;--accent:#b24b63}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:980px;margin:auto;padding:28px 16px 60px}.head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:20px}.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--accent);text-transform:uppercase}.title{font-size:30px;font-weight:800;line-height:1.1}.sub{color:var(--muted);margin-top:6px}.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 5px 20px #00000008}label{display:block;font-weight:700;margin-bottom:8px}textarea,input,select{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;padding:11px;font:inherit;outline:none}textarea{min-height:170px;resize:vertical}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 13px;cursor:pointer;font:inherit}button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}button.danger{color:#a22;border-color:#ecc}.intent{display:grid;grid-template-columns:1fr 1fr;gap:8px}.intent button.active{background:#f4dce2;border-color:#c88495}.prompt{min-height:150px;white-space:pre-wrap;background:#171717;color:#f5f5f5;border-radius:12px;padding:14px;font:13px/1.8 ui-monospace,SFMono-Regular,Menlo,monospace}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{font-size:12px;background:#f3f0eb;border-radius:99px;padding:4px 8px}.char-list{display:grid;gap:8px}.char{border:1px solid var(--line);border-radius:10px;padding:10px}.char b{display:block}.small{font-size:12px;color:var(--muted)}.hidden{display:none}.status{font-size:12px;color:var(--muted);margin-top:8px}@media(max-width:760px){.grid{grid-template-columns:1fr}.head{display:block}.title{font-size:25px}}
</style>
</head>
<body>
<main>
<header class="head"><div><div class="eyebrow">NAI PROMPT COMPILER · V0.1</div><div class="title">自然语言 → NAI Prompt</div><div class="sub">先做可运行的基础编译器，后续逐步加入 AI 语义解析、角色锚定与更完整的视觉规则。</div></div></header>
<section class="grid">
<div class="card">
<label for="input">自然语言描述</label>
<textarea id="input" placeholder="例如：一个黑发男生独自站在雨夜街道上，我想要有张力的构图"></textarea>
<div class="row">
<button class="primary" id="translate">生成 Prompt</button><button id="clear">清空</button>
</div>
<div style="margin-top:18px"><label>视觉意图</label><div class="intent">
<button data-intent="none" class="active">自然</button><button data-intent="tension">张力</button><button data-intent="cinematic">电影感</button><button data-intent="lonely">孤独感</button>
</div></div>
<div style="margin-top:18px"><label>生成结果</label><div id="prompt" class="prompt">等待输入……</div><div class="row"><button id="copy">复制 Prompt</button></div><div id="status" class="status"></div></div>
</div>
<aside class="card">
<label>角色管理器</label>
<div id="chars" class="char-list"></div>
<div class="row"><button class="primary" id="newChar">＋ 新建角色</button></div>
<div id="editor" class="hidden" style="margin-top:14px">
<input id="cname" placeholder="角色名称">
<div class="row"><input id="cgender" placeholder="性别，例如：男"></div>
<div class="row"><input id="chair" placeholder="发色/发型，例如：黑色短发"></div>
<div class="row"><input id="ceye" placeholder="眼睛，例如：深色眼睛"></div>
<div class="row"><input id="ccloth" placeholder="固定服装（可留空）"></div>
<div class="row"><input id="cfeature" placeholder="其他特征（可留空）"></div>
<div class="row"><button class="primary" id="saveChar">保存角色</button><button id="cancelChar">取消</button></div>
</div>
</aside>
</section>
</main>
<script>
const KEY="nai_prompt_characters_v01";
let chars=JSON.parse(localStorage.getItem(KEY)||"[]"), editing=null, intent="none";
const $=s=>document.querySelector(s);
function save(){localStorage.setItem(KEY,JSON.stringify(chars));renderChars()}
function renderChars(){const box=$("#chars");box.innerHTML=chars.length?chars.map((c,i)=>'<div class="char"><b>'+esc(c.name)+'</b><div class="small">'+esc([c.gender,c.hair,c.eye,c.cloth,c.feature].filter(Boolean).join(" · ")||"外貌未设置")+'</div><div class="row"><button onclick="editChar('+i+')">编辑</button><button class="danger" onclick="delChar('+i+')">删除</button></div></div>').join(""):'<div class="small">暂无角色。未填写外貌时，生成器会保留 [APPEARANCE] 占位。</div>'}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
window.editChar=i=>{editing=i;let c=chars[i];$("#cname").value=c.name;$("#cgender").value=c.gender;$("#chair").value=c.hair;$("#ceye").value=c.eye;$("#ccloth").value=c.cloth;$("#cfeature").value=c.feature;$("#editor").classList.remove("hidden")}
window.delChar=i=>{chars.splice(i,1);save()}
$("#newChar").onclick=()=>{editing=null;["cname","cgender","chair","ceye","ccloth","cfeature"].forEach(id=>$("#"+id).value="");$("#editor").classList.remove("hidden")}
$("#cancelChar").onclick=()=>$("#editor").classList.add("hidden")
$("#saveChar").onclick=()=>{let c={name:$("#cname").value.trim(),gender:$("#cgender").value.trim(),hair:$("#chair").value.trim(),eye:$("#ceye").value.trim(),cloth:$("#ccloth").value.trim(),feature:$("#cfeature").value.trim()};if(!c.name)return;editing===null?chars.push(c):chars[editing]=c;save();$("#editor").classList.add("hidden")}
document.querySelectorAll("[data-intent]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-intent]").forEach(x=>x.classList.remove("active"));b.classList.add("active");intent=b.dataset.intent})
function parse(text){
 let p=[]; const add=x=>{if(x&&!p.includes(x))p.push(x)};
 if(/两个|2个|两名|两人|一男一女/.test(text)) add("2people");
 else if(/女生|女孩|女人|女性/.test(text)) add("1girl");
 else if(/男生|男孩|男人|男性/.test(text)) add("1boy");
 if(/独自|一个人|单独|solo/.test(text)) add("solo");
 const map=[[/黑发|黑色头发/,"black hair"],[/白发|白色头发/,"white hair"],[/金发|金色头发|金发/,"blonde hair"],[/银发|银色头发/,"silver hair"],[/长发/,"long hair"],[/短发/,"short hair"],[/红眼|红色眼睛/,"red eyes"],[/蓝眼|蓝色眼睛/,"blue eyes"],[/眼镜/,"glasses"],[/黑色风衣|黑风衣/,"black coat, long coat"],[/黑色西装|黑西装/,"black suit"],[/白色连衣裙|白裙/,"white dress"],[/校服/,"school uniform"],[/雨伞|撑伞/,"umbrella"],[/咖啡店|咖啡馆/,"cafe"],[/街道|街上/,"street"],[/雨夜|下雨的夜晚/,"night, rain"],[/雪地|雪中/,"snow"],[/窗边/,"by window"],[/废墟/,"ruins"],[/天台|屋顶/,"rooftop"],[/站着|站立/,"standing"],[/坐着/,"sitting"],[/走路|行走/,"walking"],[/聊天|交谈/,"talking"],[/对峙|对抗/,"facing each other"]]; map.forEach(([re,v])=>{if(re.test(text))v.split(", ").forEach(add)});
 let hasAppearance=/黑发|黑色头发|白发|白色头发|金发|金色头发|银发|银色头发|长发|短发|红眼|红色眼睛|蓝眼|蓝色眼睛|眼镜/.test(text);
 if((/男生|男人|男性|男孩/.test(text)||/女生|女孩|女人|女性/.test(text))&&!hasAppearance)add("[APPEARANCE]");
 const active=chars.find(c=>c.name&&text.includes(c.name));
 if(active){p=p.filter(x=>!["1boy","1girl","solo"].includes(x));add(active.gender==="男"?"1boy":active.gender==="女"?"1girl":"1person"); if(active.hair)add(active.hair); if(active.eye)add(active.eye); if(active.feature)add(active.feature); if(active.cloth)add(active.cloth); if(!active.hair&&!active.eye&&!active.feature)add("[APPEARANCE]")}
 if(intent==="tension")["low angle","dutch angle","dynamic composition","dramatic perspective","foreshortening","dramatic lighting"].forEach(add);
 if(intent==="cinematic")["cinematic composition","cinematic lighting","depth of field","dramatic perspective"].forEach(add);
 if(intent==="lonely")["wide shot","off-center composition","negative space","soft atmospheric lighting"].forEach(add);
 return weight(p).join(", ")
}
function weight(arr){return arr.map(x=>/^(black hair|white hair|blonde hair|silver hair|red eyes|blue eyes|glasses)$/.test(x)?"("+x+":1.15)":x)}
$("#translate").onclick=()=>{$("#prompt").textContent=parse($("#input").value.trim())||"请输入自然语言描述。";$("#status").textContent="V0.1：规则解析模式。后续可接入真正的语义模型。"}
$("#clear").onclick=()=>{$("#input").value="";$("#prompt").textContent="等待输入……";$("#status").textContent=""}
$("#copy").onclick=async()=>{await navigator.clipboard.writeText($("#prompt").textContent);$("#status").textContent="已复制"}
renderChars()
</script>
</body></html>
