<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NAI Prompt Compiler</title>
<style>
:root{
  --bg:#f5f3ef;--card:#fff;--ink:#171717;--muted:#777;--line:#ddd7cf;
  --accent:#b24b63;--soft:#f4dce2;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 system-ui,-apple-system,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#1a1a1a;--card:#242424;--ink:#f0f0f0;--muted:#999;--line:#333;--soft:#3a2028}}
main{max-width:1080px;margin:auto;padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(60px + env(safe-area-inset-bottom,0px))}
.head{margin-bottom:16px}
.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--accent);text-transform:uppercase}
.title{font-size:28px;font-weight:800;line-height:1.1}
.sub{color:var(--muted);margin-top:6px;font-size:13px}
.nav{display:flex;gap:8px;overflow-x:auto;margin:18px 0;padding-bottom:2px}
.nav button{white-space:nowrap;flex-shrink:0}
.nav button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.page{display:none}.page.active{display:block}
.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 5px 20px #00000008}
label{display:block;font-weight:700;margin-bottom:8px}
textarea,input,select{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:11px;font:inherit;outline:none}
textarea{min-height:160px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:9px 13px;cursor:pointer;font:inherit}
button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
button.danger{color:#a22;border-color:#ecc}
.intent{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.intent button.active{background:var(--soft);border-color:#c88495}
.prompt{min-height:140px;white-space:pre-wrap;background:#171717;color:#f5f5f5;border-radius:12px;padding:14px;font:13px/1.8 ui-monospace,SFMono-Regular,Menlo,monospace}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;background:#f3f0eb;border-radius:99px;padding:4px 8px;color:#333}
.small{font-size:12px;color:var(--muted)}
.hidden{display:none}
.status{font-size:12px;color:var(--muted);margin-top:8px}
.char-list,.save-list{display:grid;gap:8px}
.char,.save-item{border:1px solid var(--line);border-radius:11px;padding:11px;background:var(--card)}
.char b,.save-item b{display:block}
.toolbar{display:grid;grid-template-columns:1fr 180px;gap:8px}
/* 词库分类栏 */
.catbar{margin:12px 0;display:flex;gap:8px;align-items:center}
.cat-select{flex:1}
.cat-select select{width:100%;padding:9px 11px}
.cat-count{font-size:12px;color:var(--muted);white-space:nowrap}
.vocab-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.vocab{border:1px solid var(--line);border-radius:11px;padding:11px;cursor:pointer;background:var(--card)}
.vocab.selected{border-color:#c88495;background:#fff8fa}
.vocab-top{display:flex;align-items:center;gap:8px}
.vocab input[type=checkbox]{width:auto;flex-shrink:0}
.tag{font-weight:700}
.meta{font-size:11px;color:var(--muted);margin-top:4px}
.alias{font-size:12px;color:#888;margin-top:5px}
.save-layout{display:grid;grid-template-columns:320px 1fr;gap:16px}
.save-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.save-tag{font-size:11px;background:#f3f0eb;border-radius:99px;padding:3px 7px}
.save-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.import-box{border:1px dashed var(--line);border-radius:12px;padding:12px;margin-top:12px}
.import-list{display:grid;gap:7px;margin-top:10px}
.import-item{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--card)}
.import-item b{font-size:13px}
@media(max-width:760px){
  .grid,.toolbar,.save-layout{grid-template-columns:1fr}
  .title{font-size:22px}
  .vocab-grid{grid-template-columns:1fr}
  .intent{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<main>
<header class="head">
  <div class="eyebrow">NAI PROMPT COMPILER · V0.6</div>
  <div class="title">自然语言 → NAI Prompt</div>
  <div class="sub">离线运行 · 自然语言编译 · 角色管理 · 词库预览（含NSFW）· 提示词资料库</div>
</header>
<nav class="nav">
  <button class="active" data-page="translatePage">① 自然语言转化</button>
  <button data-page="characterPage">② 角色管理</button>
  <button data-page="vocabPage">③ 词库预览</button>
  <button data-page="importPage">④ 词库管理</button>
  <button data-page="libraryPage">⑤ 提示词资料库</button>
</nav>

<!-- 页面①：翻译 -->
<section id="translatePage" class="page active">
  <div class="grid">
    <div class="card">
      <label for="input">自然语言描述</label>
      <textarea id="input" placeholder="例如：黑发男生穿黑西装撑伞，白发女生穿白裙拿着花，两人在雨夜街道上对视，我想要有张力的电影感构图"></textarea>
      <div class="row">
        <button class="primary" id="translate">生成 Prompt</button>
        <button id="clear">清空</button>
        <button id="saveCurrent">保存到资料库</button>
      </div>
      <div style="margin-top:18px">
        <label>视觉意图（可覆盖自动识别）</label>
        <div class="intent">
          <button data-intent="none" class="active">自然</button>
          <button data-intent="tension">张力</button>
          <button data-intent="cinematic">电影感</button>
          <button data-intent="lonely">孤独感</button>
        </div>
      </div>
      <div style="margin-top:18px">
        <label>生成结果</label>
        <div id="prompt" class="prompt">等待输入……</div>
        <div class="row"><button id="copy">复制 Prompt</button></div>
        <div id="status" class="status"></div>
      </div>
    </div>
    <aside class="card">
      <label>当前手选标签</label>
      <div id="selectedTags" class="chips"><span class="small">暂无手动选择</span></div>
      <div style="margin-top:18px">
        <label>角色概览</label>
        <div id="charMini" class="char-list"></div>
      </div>
    </aside>
  </div>
</section>

<!-- 页面②：角色管理 -->
<section id="characterPage" class="page">
  <div class="card">
    <label>角色管理器</label>
    <div class="small">角色资料保存在当前浏览器。锁定属性不会被场景覆盖；场景中的临时服装、动作只作用于当前编译。</div>
    <div id="chars" class="char-list" style="margin-top:12px"></div>
    <div class="row"><button class="primary" id="newChar">＋ 新建角色</button></div>
    <div id="editor" class="hidden" style="margin-top:14px">
      <input id="cname" placeholder="角色名称">
      <div class="row"><input id="cgender" placeholder="性别，例如：男"></div>
      <div class="row"><input id="chair" placeholder="发色/发型，例如：黑色短发"></div>
      <div class="row"><input id="ceye" placeholder="眼睛，例如：红色眼睛"></div>
      <div class="row"><input id="ccloth" placeholder="固定服装（可留空）"></div>
      <div class="row"><input id="cfeature" placeholder="其他特征（可留空）"></div>
      <div class="row">
        <label style="display:flex;align-items:center;gap:8px;font-weight:400;margin:0">
          <input id="clock" type="checkbox" style="width:auto"> 锁定角色基础属性
        </label>
      </div>
      <div class="row">
        <button class="primary" id="saveChar">保存角色</button>
        <button id="cancelChar">取消</button>
      </div>
    </div>
  </div>
</section>

<!-- 页面③：词库预览 -->
<section id="vocabPage" class="page">
  <div class="card">
    <label>NAI 词库预览</label>
    <div class="small">浏览词库并手动选词，勾选后加入下一次编译结果。</div>
    <div class="toolbar" style="margin-top:14px">
      <input id="vsearch" placeholder="搜索英文标签或中文别名……">
      <select id="vsource"><option value="all">全部来源</option><option value="local">内置词库</option><option value="open_source">开源词库</option><option value="custom">自定义</option></select>
    </div>
    <div class="catbar">
      <div class="cat-select"><select id="categorySelect"></select></div>
      <div id="catCount" class="cat-count"></div>
    </div>
    <div class="row">
      <button id="clearSelected">清除已选</button>
      <button class="primary" id="applySelected">应用到编译器</button>
    </div>
    <div id="vocabCount" class="status"></div>
    <div id="vocabGrid" class="vocab-grid" style="margin-top:12px"></div>
  </div>
</section>

<!-- 页面④：词库管理 -->
<section id="importPage" class="page">
  <div class="card">
    <label>词库管理</label>
    <div class="small">可导入自定义 JSON 词库，保存在当前浏览器，不会覆盖内置词库。</div>
    <div class="import-box">
      <label for="vocabFile">导入词库</label>
      <input id="vocabFile" type="file" accept=".json,.txt,.md">
      <div class="small" style="margin-top:7px">支持 JSON / TXT / MD；TXT/MD 可一行一个词，或「英文标签 | 中文别名」格式。</div>
      <div class="row">
        <button class="primary" id="importVocab">导入</button>
        <button id="exportVocab">导出我的词库</button>
        <button class="danger" id="clearCustomVocab">清空我的词库</button>
      </div>
      <div id="importStatus" class="status"></div>
    </div>
    <div style="margin-top:16px">
      <label>我的词库</label>
      <div id="customVocabList" class="import-list"></div>
    </div>
  </div>
</section>

<!-- 页面⑤：提示词资料库 -->
<section id="libraryPage" class="page">
  <div class="save-layout">
    <div class="card">
      <label>提示词资料库</label>
      <div class="small">保存曾经生成的提示词，便于复用与搜索。</div>
      <div style="margin-top:14px"><input id="saveTitle" placeholder="名称，例如：雨夜双人构图"></div>
      <div style="margin-top:10px"><input id="saveTags" placeholder="画面标签，逗号分隔，例如：雨夜, 双人, 对视"></div>
      <div style="margin-top:10px"><label>自然语言</label><textarea id="saveNatural" style="min-height:100px" placeholder="记录当时使用的中文描述……"></textarea></div>
      <div style="margin-top:10px"><label>NAI Prompt</label><textarea id="saveNai" style="min-height:140px" placeholder="记录最终的 NAI 标签……"></textarea></div>
      <div class="row">
        <button class="primary" id="saveEntry">保存资料</button>
        <button id="clearEntry">清空表单</button>
      </div>
      <div id="libraryStatus" class="status"></div>
    </div>
    <div class="card">
      <label>已保存的提示词</label>
      <div class="toolbar" style="margin-top:10px">
        <input id="librarySearch" placeholder="搜索名称、标签、自然语言或 NAI 标签……">
        <select id="libraryFilter"><option value="all">全部</option><option value="tag">按画面标签</option><option value="nai">按 NAI Prompt</option></select>
      </div>
      <div id="saveList" class="save-list" style="margin-top:12px"></div>
    </div>
  </div>
</section>
</main>

/*
 * REAL OPEN-SOURCE TAG SOURCE
 * Upstream: Yellow-Rush/zh_CN-Tags
 * https://github.com/Yellow-Rush/zh_CN-Tags
 * The repository publishes a Simplified-Chinese Danbooru tag mapping.
 * We fetch it at runtime and cache it locally; the original built-in vocabulary
 * remains authoritative when the same canonical tag already exists.
 */
const OPEN_SOURCE_TAG_URL="https://raw.githubusercontent.com/Yellow-Rush/zh_CN-Tags/main/danbooru.csv";
const OPEN_SOURCE_CACHE_KEY="nai_open_source_zhcn_tags_v1";
const OPEN_SOURCE_CACHE_AT_KEY="nai_open_source_zhcn_tags_at_v1";
const OPEN_SOURCE_CACHE_TTL=1000*60*60*24*7;
let OPEN_SOURCE_VOCAB=[];

function parseCSVPairLine(line){
  let comma=-1,quoted=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch==='"'){
      if(quoted && line[i+1]==='"'){i++;continue;}
      quoted=!quoted;
    }else if(ch===','&&!quoted){comma=i;break;}
  }
  if(comma<0) return null;
  const tag=line.slice(0,comma).trim();
  let alias=line.slice(comma+1).trim();
  if(alias.startsWith('"')&&alias.endsWith('"')) alias=alias.slice(1,-1).replace(/""/g,'"');
  if(!tag||!alias) return null;
  return {tag,alias};
}

function normalizeOpenSourceEntry(tag,alias){
  const canonical=String(tag||"").trim().replace(/_/g," ");
  if(!canonical) return null;
  const aliases=String(alias||"").split(/[|／]/).map(x=>x.trim()).filter(Boolean);
  if(!aliases.length) return null;
  return {
    canonical_tag:canonical,
    aliases:[...new Set(aliases)],
    category:"open_source",
    related:[],
    conflicts:[],
    source:"open-source: Yellow-Rush/zh_CN-Tags"
  };
}

function parseOpenSourceCSV(raw){
  const map=new Map();
  String(raw||"").split(/\r?\n/).forEach(line=>{
    const pair=parseCSVPairLine(line.trim());
    if(!pair) return;
    const e=normalizeOpenSourceEntry(pair.tag,pair.alias);
    if(!e) return;
    const old=map.get(e.canonical_tag);
    if(old){
      old.aliases=[...new Set(old.aliases.concat(e.aliases))];
    }else map.set(e.canonical_tag,e);
  });
  return [...map.values()];
}

function loadCachedOpenSource(){
  try{
    const at=Number(localStorage.getItem(OPEN_SOURCE_CACHE_AT_KEY)||0);
    if(!at || Date.now()-at>OPEN_SOURCE_CACHE_TTL) return [];
    const raw=localStorage.getItem(OPEN_SOURCE_CACHE_KEY);
    if(!raw) return [];
    const data=JSON.parse(raw);
    return Array.isArray(data)?data:[];
  }catch(e){ return []; }
}

async function loadOpenSourceVocab(force=false){
  if(!force){
    const cached=loadCachedOpenSource();
    if(cached.length){
      OPEN_SOURCE_VOCAB=cached;
      return {count:cached.length,cached:true};
    }
  }
  try{
    const resp=await fetch(OPEN_SOURCE_TAG_URL,{cache:"no-store"});
    if(!resp.ok) throw new Error("HTTP "+resp.status);
    const raw=await resp.text();
    const data=parseOpenSourceCSV(raw);
    if(!data.length) throw new Error("empty dictionary");
    OPEN_SOURCE_VOCAB=data;
    try{
      localStorage.setItem(OPEN_SOURCE_CACHE_KEY,JSON.stringify(data));
      localStorage.setItem(OPEN_SOURCE_CACHE_AT_KEY,String(Date.now()));
    }catch(e){}
    return {count:data.length,cached:false};
  }catch(e){
    OPEN_SOURCE_VOCAB=[];
    console.warn("Open-source vocabulary unavailable:",e);
    return {count:0,cached:false,error:String(e)};
  }
}

function allVocabulary(){
  const merged = [...BUILT_IN_VOCAB, ...OPEN_SOURCE_VOCAB, ...customVocabulary.map(e=>({...e,source:"custom"}))];
  const map = new Map();
  merged.forEach(e=>{
    if(!e||!e.canonical_tag) return;
    const key=String(e.canonical_tag).trim();
    if(!map.has(key)) map.set(key,e);
  });
  return [...map.values()];
}

function categories(){
  const order = ["all","appearance","hair","eyes","face","anatomy","clothing","accessories","footwear",
                 "action","pose","environment","object","nature","animal","food","architecture","vehicle","composition","camera","lighting",
                 "nsfw_lingerie","nsfw_male","nsfw_legwear","nsfw_bdsm","nsfw_toys"];
  const existing = new Set(allVocabulary().map(e=>e.category).filter(Boolean));
  const result = order.filter(c=> c==="all" || existing.has(c));
  // 追加不在order里的分类
  existing.forEach(c=>{ if(!order.includes(c)) result.push(c); });
  return result;
}

// ── 词库匹配 ──────────────────────────────────────────────
function matchVocabulary(text){
  const source=String(text||"");
  const entries=allVocabulary().filter(Boolean);
  const candidates=[];
  entries.forEach(entry=>{
    [entry.canonical_tag,...(entry.aliases||[])]
      .filter(x=>x && String(x).trim().length>=2)
      .sort((a,b)=>String(b).length-String(a).length)
      .forEach(alias=>{
        const a=String(alias).trim();
        let from=0;
        while(from<source.length){
          const pos=source.toLowerCase().indexOf(a.toLowerCase(),from);
          if(pos<0) break;
          candidates.push({entry,alias:a,pos,end:pos+a.length});
          from=pos+a.length;
        }
      });
  });
  candidates.sort((a,b)=>(b.alias.length-a.alias.length)||(a.pos-b.pos));
  const occupied=[];
  const out=[];
  candidates.forEach(hit=>{
    if(occupied.some(r=>hit.pos<r.end && hit.end>r.pos)) return;
    occupied.push(hit);
    out.push(hit.entry);
  });
  return out;
}

// ── 核心编译器 ────────────────────────────────────────────
function parse(text){
  if(!text) return "";

  /*
   * NAI Semantic Compiler v1
   * 核心原则：中文“语义片段”→结构化事件→词库 canonical tag→NAI 语义单元。
   * 不再把中文逐词翻译成孤立 token。
   */
  const source=String(text)
    .replace(/[\u3000]/g," ")
    .replace(/[“”‘’]/g,"")
    .replace(/\s+/g," ")
    .trim();

  const vocab=allVocabulary();
  const byTag=new Map(vocab.map(e=>[e.canonical_tag,e]));
  const norm=s=>String(s||"").replace(/_/g," ").trim();
  const entry=t=>byTag.get(norm(t))||null;
  const aliasesOf=e=>[e?.canonical_tag,...(e?.aliases||[])].filter(Boolean).map(norm);

  // 中文表面语法归一化：只处理句式，不改变语义。
  let textN=source;
  [
    [/穿着|身穿|穿上|穿了/g,"穿"],
    [/戴着|戴了|佩戴着/g,"戴"],
    [/拿着|手里拿着|手持|握着|捧着/g,"拿"],
    [/撑着一把|撑着|打着一把|打着/g,"撑伞"],
    [/正在|正/g,""],
    [/长长的头发/g,"长发"],
    [/短短的头发/g,"短发"]
  ].forEach(([re,to])=>textN=textN.replace(re,to));

  const hits=[];
  const seen=new Set();
  vocab.forEach(e=>{
    aliasesOf(e).sort((x,y)=>y.length-x.length).forEach(alias=>{
      if(alias.length<2) return;
      let from=0;
      while(from<textN.length){
        const p=textN.toLowerCase().indexOf(alias.toLowerCase(),from);
        if(p<0) break;
        const key=e.canonical_tag+"@"+p;
        if(!seen.has(key)){
          seen.add(key);
          hits.push({tag:e.canonical_tag,entry:e,pos:p,end:p+alias.length,alias});
        }
        from=p+Math.max(1,alias.length);
      }
    });
  });
  hits.sort((x,y)=>(x.pos-y.pos)||(y.alias.length-x.alias.length));

  const has=(tag)=>hits.some(h=>h.tag===tag);
  const hitTags=(category)=>{
    const s=new Set();
    hits.forEach(h=>{if(!category||h.entry?.category===category)s.add(h.tag)});
    return [...s];
  };
  const addUnique=(arr,tag,weight=1)=>{
    if(!tag) return;
    if(!arr.some(x=>x.tag===tag)) arr.push({tag,weight});
  };

  // ── 1. 人物实体解析 ───────────────────────────────────
  const personSpans=[];
  const personRe=/(?:一个|一名|一位|两个|两名|两位|三个人|三名|两人|三人)?\s*(?:年轻的)?\s*(?:男生|男孩|男人|男性|男士|女生|女孩|女人|女性|女士|人物|角色)/g;
  let m;
  while((m=personRe.exec(textN))){
    const raw=m[0];
    const male=/男生|男孩|男人|男性|男士/.test(raw);
    const female=/女生|女孩|女人|女性|女士/.test(raw);
    const count=/两个|两名|两位|两人/.test(raw)?2:/三个人|三名|三人/.test(raw)?3:1;
    personSpans.push({pos:m.index,end:m.index+raw.length,gender:male?"male":female?"female":"unknown",count,raw});
  }

  const pronouns=[];
  const proRe=/他|她|他们|她们|其|对方/g;
  while((m=proRe.exec(textN))) pronouns.push({text:m[0],pos:m.index,end:m.index+m[0].length});

  // 关系/互动语句中，重复代词通常表示不同参与者，而不是“一个人出现两次”。
  const relationCue=/牵|牵着|牵住|牵手|手牵手|拥抱|抱着|抱住|亲吻|接吻|对视|面对彼此|面对面|看着对方/;
  let inferredPeople=null;
  if(relationCue.test(textN)){
    const maleP=(textN.match(/他/g)||[]).length;
    const femaleP=(textN.match(/她/g)||[]).length;
    const maleN=(textN.match(/男生|男孩|男人|男性|男士/g)||[]).length;
    const femaleN=(textN.match(/女生|女孩|女人|女性|女士/g)||[]).length;
    if(maleP>=2 && femaleP===0) inferredPeople="2boys";
    else if(femaleP>=2 && maleP===0) inferredPeople="2girls";
    else if(maleP>=1 && femaleP>=1) inferredPeople="1boy, 1girl";
    else if(maleN>=2 && femaleN===0) inferredPeople="2boys";
    else if(femaleN>=2 && maleN===0) inferredPeople="2girls";
  }

  const personTags=[];
  const explicitCounts=personSpans.reduce((s,p)=>s+p.count,0);
  if(inferredPeople){
    inferredPeople.split(/,\s*/).forEach(t=>addUnique(personTags,t));
  }else if(/一男一女/.test(textN)){
    addUnique(personTags,"1boy"); addUnique(personTags,"1girl");
  }else if(explicitCounts){
    const boys=personSpans.filter(p=>p.gender==="male").reduce((s,p)=>s+p.count,0);
    const girls=personSpans.filter(p=>p.gender==="female").reduce((s,p)=>s+p.count,0);
    if(boys) addUnique(personTags,boys+"boy"+(boys>1?"s":""));
    if(girls) addUnique(personTags,girls+"girl"+(girls>1?"s":""));
    if(!boys&&!girls) addUnique(personTags,explicitCounts+"people");
  }else if(/独自|一个人|单独|solo/.test(textN)){
    addUnique(personTags,"solo");
  }else if(/男生|男孩|男人|男性|男士/.test(textN)){
    addUnique(personTags,"1boy");
  }else if(/女生|女孩|女人|女性|女士/.test(textN)){
    addUnique(personTags,"1girl");
  }

  // ── 2. 词库命中 → 语义节点 ────────────────────────────
  const nodes=hits.map(h=>({
    tag:h.tag,entry:h.entry,pos:h.pos,end:h.end,alias:h.alias,
    category:h.entry?.category||"unknown"
  }));

  const actions=new Set(["action","pose"]);
  const appearances=new Set(["appearance","hair","eyes","face"]);
  const wearables=new Set(["clothing","accessories","footwear"]);
  const places=new Set(["environment","nature","architecture","vehicle","object","animal","food"]);
  const cameras=new Set(["camera","composition","lighting"]);

  const actionNodes=nodes.filter(n=>actions.has(n.category));
  const objectNodes=nodes.filter(n=>places.has(n.category));
  const appearanceNodes=nodes.filter(n=>appearances.has(n.category));
  const clothingNodes=nodes.filter(n=>wearables.has(n.category));

  // ── 3. 中文语义关系识别 ───────────────────────────────
  // 每条关系先建立“事件”，最终事件才会输出成 NAI 词组。
  const phrases=[];
  const consumed=new Set();
  const addPhrase=(tag,weight=1.14,consume=[])=>{
    if(!tag) return;
    phrases.push({tag,weight});
    consume.forEach(x=>consumed.add(x));
  };

  const hasChinese=re=>re.test(textN);
  const local=(p1,p2,max=28)=>{
    return Math.abs(p1-p2)<=max;
  };

  // 人与人关系：优先级最高，避免被“手/看/站”等普通词拆散。
  if(/牵着手|牵住手|牵手|手牵手/.test(textN)){
    addPhrase("holding hands",1.22,["holding hands"]);
  }else if(/拥抱|抱着|抱住/.test(textN)){
    const t=has("hugging")?"hugging":"hugging";
    addPhrase(t,1.20,[t]);
  }else if(/亲吻|接吻|吻着/.test(textN)){
    addPhrase(has("kiss")?"kiss":"kissing",1.20,has("kiss")?["kiss"]:[]);
  }else if(/对视|看着对方|互相看|彼此对视/.test(textN)){
    addPhrase(has("looking at each other")?"looking at each other":"looking at each other",1.18,["looking at each other"]);
  }else if(/面对面|面对彼此|互相面对/.test(textN)){
    if(/坐着|坐在|坐于/.test(textN) && has("sitting")){
      addPhrase("facing each other while sitting",1.18,["facing each other","sitting"]);
    }else if(has("facing each other")){
      addPhrase("facing each other",1.16,["facing each other"]);
    }
  }

  // 动作 + 身体部位：例如“伸出手指”必须理解为动作，而不是 finger 单词。
  const pointingText=/伸出手指|伸手指向|用手指指向|手指指向|指着|指向|指给|指着看/;
  if(pointingText.test(textN)){
    addPhrase(has("pointing")?"pointing":"pointing with finger",1.18,has("pointing")?["pointing"]:[]);
    const fingerNode=nodes.find(n=>/finger|手指/i.test(n.tag+" "+n.alias));
    if(fingerNode) consumed.add(fingerNode.tag);
  }

  // 动作 + 宾语：使用词库节点的位置和中文句式判断关系。
  const relationPatterns=[
    {re:/(坐在|坐着|坐于)/,prep:"on",cats:["object","architecture","environment"],max:24},
    {re:/(站在|站着|站于)/,prep:"at",cats:["object","architecture","environment"],max:24},
    {re:/(靠着|倚着|倚靠)/,prep:"against",cats:["object","architecture"],max:24},
    {re:/(看着|望着|注视着|凝视着|盯着)/,prep:"at",cats:["object","animal","food"],max:22},
    {re:/(指着|指向|指给)/,prep:"at",cats:["object","architecture","vehicle","animal"],max:22}
  ];
  relationPatterns.forEach(rule=>{
    if(!rule.re.test(textN)) return;
    const act=actionNodes
      .filter(n=>rule.re.test((n.alias||"")) || /sitting|standing|looking|pointing/i.test(n.tag))
      .sort((a,b)=>Math.abs(a.pos-(textN.search(rule.re)))-Math.abs(b.pos-(textN.search(rule.re))))[0];
    const obj=objectNodes
      .filter(n=>rule.cats.includes(n.category))
      .sort((a,b)=>Math.abs(a.pos-(act?.pos??0))-Math.abs(b.pos-(act?.pos??0)))[0];
    if(act&&obj&&local(act.pos,obj.pos,rule.max)){
      addPhrase(act.tag+" "+rule.prep+" "+obj.tag,1.15,[act.tag,obj.tag]);
    }
  });

  // 动作 + 环境：只有局部事件成立时才合并。
  const envNodes=nodes.filter(n=>n.category==="environment");
  actionNodes.forEach(act=>{
    const env=envNodes
      .filter(e=>local(act.pos,e.pos,30))
      .sort((a,b)=>Math.abs(a.pos-act.pos)-Math.abs(b.pos-act.pos))[0];
    if(!env) return;
    let phrase="";
    if(/走|行走|漫步/.test(textN)&&/walking/i.test(act.tag)) phrase=act.tag+" in "+env.tag;
    else if(/站/.test(textN)&&/standing/i.test(act.tag)) phrase=act.tag+" in "+env.tag;
    else if(/坐/.test(textN)&&/sitting/i.test(act.tag)) phrase=act.tag+" in "+env.tag;
    if(phrase) addPhrase(phrase,1.12,[act.tag,env.tag]);
  });

  // ── 4. 修饰语归属：颜色/长度/服装等跟随最近的中心名词 ───
  const modifiers=[];
  const colorMap=[
    ["黑","black"],["白","white"],["红","red"],["蓝","blue"],["绿","green"],
    ["黄","yellow"],["紫","purple"],["粉","pink"],["棕","brown"],["灰","gray"],["银","silver"],["金","blonde"]
  ];
  const centers=[
    {re:/头发|发型/,type:"hair"},
    {re:/眼睛|眼眸|眼瞳|眼/,type:"eyes"},
    {re:/裙子|裙装|连衣裙|裙/,type:"dress"},
    {re:/西装|套装/,type:"suit"},
    {re:/大衣|外套|风衣/,type:"coat"},
    {re:/花/,type:"flower"},
    {re:/伞/,type:"umbrella"}
  ];
  centers.forEach(c=>{
    const centerRe=new RegExp(c.re.source,c.re.flags.replace(/g/g,"")+"g");\n    const cm=[];\n    let centerMatch;\n    while((centerMatch=centerRe.exec(textN))!==null){\n      cm.push(centerMatch);\n      if(centerMatch[0]==="") centerRe.lastIndex++;\n    }
    cm.forEach(x=>{
      const before=textN.slice(Math.max(0,x.index-10),x.index);
      colorMap.forEach(([cn,en])=>{
        if(new RegExp(cn+"色?").test(before)){
          const tagByType={
            hair:en+" hair",eyes:en==="blonde"?"yellow eyes":en+" eyes",
            dress:en+" dress",suit:en+" suit",coat:en+" coat",
            flower:en+" flower",umbrella:en+" umbrella"
          }[c.type];
          if(entry(tagByType)) modifiers.push({tag:tagByType,pos:x.index});
        }
      });
    });
  });

  // ── 5. 角色管理器属性：角色名出现时，把属性绑定到角色，而不是全局乱加。
  const matchedChars=chars.filter(c=>c.name&&textN.includes(c.name));
  const characterTags=[];
  matchedChars.forEach(c=>{
    const props=[c.hair,c.eye,c.cloth,c.feature].filter(Boolean);
    props.forEach(p=>{
      const hs=matchVocabulary(p);
      hs.forEach(e=>addUnique(characterTags,e.canonical_tag,1.22));
    });
    const g=c.gender==="男"?"1boy":c.gender==="女"?"1girl":null;
    if(g) addUnique(characterTags,g,1.08);
  });

  // ── 6. 基础标签：命中词库但没有被更高层事件消费的标签才保留。
  const output=[];
  personTags.forEach(t=>addUnique(output,t,1));
  characterTags.forEach(x=>addUnique(output,x.tag,x.weight));

  nodes.forEach(n=>{
    if(consumed.has(n.tag)) return;
    // 颜色碎片不单独输出，已经由“颜色+中心名词”处理。
    if(modifiers.some(x=>x.tag===n.tag)) return;
    // generic person tokens不作为普通词库碎片。
    if(/^(1|2|3)(boy|girl|person|people|boys|girls)$/.test(n.tag)) return;
    addUnique(output,n.tag,
      appearances.has(n.category)?1.16:
      wearables.has(n.category)?1.12:
      actions.has(n.category)?1.10:
      1);
  });

  modifiers.forEach(x=>{
    if(!consumed.has(x.tag)) addUnique(output,x.tag,1.16);
  });

  // 事件词组放到对应基础标签的位置，但不再把组成它们的 token 重复输出。
  phrases.forEach(p=>{
    p.tag=p.tag.replace(/\s+/g," ").trim();
    if(!output.some(x=>x.tag===p.tag)) output.push(p);
    p.tag.split(/\s+(?:on|at|in|against|with)\s+/).forEach(part=>{
      // 只有完整 canonical tag 才消费；组合短语本身不进入词库。
      if(entry(part)) {
        const i=output.findIndex(x=>x.tag===part);
        if(i>=0) output.splice(i,1);
      }
    });
  });

  // holding hands / pointing 等关系短语即使词库没有完全相同的组合，也应保留。
  // finger 这种身体部位只有在“单纯描述手指外观”时才输出。
  if(pointingText.test(textN) && has("finger")){
    const i=output.findIndex(x=>x.tag==="finger");
    if(i>=0) output.splice(i,1);
  }

  // 明确“手指很纤细”是身体部位外观，不是 pointing。
  if(/手指.{0,5}(纤细|修长|细长|漂亮|白皙)/.test(textN)){
    if(has("finger") && !output.some(x=>x.tag==="finger")) addUnique(output,"finger",1.10);
    if(has("slender fingers") && !output.some(x=>x.tag==="slender fingers")) addUnique(output,"slender fingers",1.12);
  }

  // ── 7. 颜色/长度复合：让 NAI 接收到语义单元，而不是黑发+长发两个孤立 token。
  const combinePairs=[
    [["black hair","long hair"],"black long hair"],[["white hair","long hair"],"white long hair"],
    [["red hair","long hair"],"red long hair"],[["blue hair","long hair"],"blue long hair"],
    [["brown hair","long hair"],"brown long hair"],[["pink hair","long hair"],"pink long hair"],
    [["purple hair","long hair"],"purple long hair"],[["black hair","short hair"],"black short hair"],
    [["white hair","short hair"],"white short hair"],[["black suit","black"],"black suit"],
    [["black coat","black"],"black coat"],[["white dress","white"],"white dress"]
  ];
  combinePairs.forEach(([members,label])=>{
    const found=members.filter(t=>output.some(x=>x.tag===t)||hits.some(h=>h.tag===t));
    if(found.length<2) return;
    if(!entry(label)) return;
    members.forEach(t=>{const i=output.findIndex(x=>x.tag===t);if(i>=0)output.splice(i,1);});
    addUnique(output,label,1.16);
  });

  // ── 8. [APPEARANCE]：没有明确外貌时保留占位，不因动作/场景而消失。
  const explicitAppearance=output.some(x=>{
    const e=entry(x.tag);
    return e && appearances.has(e.category);
  });
  const genericPerson=personTags.some(x=>/boy|girl|person|people|solo/.test(x))||matchedChars.length>0;
  if(genericPerson&&!explicitAppearance&&!output.some(x=>x.tag==="[APPEARANCE]")){
    const i=output.findIndex(x=>/^(1|2|3)(boy|girl|boys|girls|people|person)$/.test(x.tag));
    const ap={tag:"[APPEARANCE]",weight:1};
    if(i>=0) output.splice(i+1,0,ap); else output.unshift(ap);
  }

  // ── 9. 视觉意图只影响构图，不污染主体语义。 ───────────
  const effectiveIntent=intent!=="none"?intent:
    (/张力|紧张|压迫感|冲突感/.test(source)?"tension":
     /电影感|电影般|镜头感|影视感/.test(source)?"cinematic":
     /孤独|寂寥|空旷|疏离/.test(source)?"lonely":"none");

  const intentTags={
    tension:[["low angle",1.08],["dynamic composition",1.08],["dramatic lighting",1.08]],
    cinematic:[["cinematic composition",1.08],["cinematic lighting",1.08],["depth of field",1.06]],
    lonely:[["wide shot",1.06],["negative space",1.08],["off-center composition",1.06]]
  };
  (intentTags[effectiveIntent]||[]).forEach(([t,w])=>{if(entry(t))addUnique(output,t,w)});

  // 稳定排序：人物→外貌→服装→关系/动作→环境→镜头。
  const order={person:0,appearance:1,hair:1,eyes:1,face:1,clothing:2,accessories:2,footwear:2,
    action:3,pose:3,environment:4,nature:4,object:4,animal:4,food:4,architecture:4,vehicle:4,
    lighting:5,composition:6,camera:6};
  const category=x=>entry(x.tag)?.category||"";
  output.sort((a,b)=>{
    const oa=order[category(a.tag)]??3, ob=order[category(b.tag)]??3;
    return oa-ob;
  });

  // 权重格式化；普通标签不加权，真正需要强调的语义单元才加权。
  return output
    .filter((x,i,a)=>a.findIndex(y=>y.tag===x.tag)===i)
    .map(x=>x.weight!==1?"("+x.tag+":"+Math.min(1.30,x.weight).toFixed(2)+")":x.tag)
    .join(", ");
}

$("#translate").onclick=async()=>{
  try{
    const textValue=$("#input").value.trim();
    if(!textValue){ $("#prompt").textContent="请输入自然语言描述。"; return; }
    // 用户可能在开源词库还没加载完时就点击生成；先确保词库可用。
    if(!OPEN_SOURCE_VOCAB.length){
      $("#status").textContent="正在加载开源中文词库…";
      await loadOpenSourceVocab();
    }
    const result=parse(textValue);
    $("#prompt").textContent=result||"未识别到可转换的 NAI 标签。";
    $("#status").textContent=result
      ? `自然语言编译完成 · 词库 ${allVocabulary().length} 条 · 手选标签 ${selected.size} 条`
      : "没有找到可转换的词库标签，请补充更具体的描述。";
  }catch(e){
    console.error("NAI prompt compile error:",e);
    $("#prompt").textContent="生成失败，请重试。";
    $("#status").textContent="编译器错误："+(e&&e.message?e.message:String(e));
  }
};
$("#clear").onclick=()=>{ $("#input").value=""; $("#prompt").textContent="等待输入……"; $("#status").textContent=""; };
$("#copy").onclick=async()=>{ await navigator.clipboard.writeText($("#prompt").textContent); $("#status").textContent="已复制 ✓"; };

// ── 资料库 ────────────────────────────────────────────────
function resetSaveForm(){ editingSave=null; $("#saveTitle").value=""; $("#saveTags").value=""; $("#saveNatural").value=""; $("#saveNai").value=""; }
function persistLibrary(){ writeJSON(LKEY,library); renderLibrary(); }
function renderLibrary(){
  const q=$("#librarySearch").value.trim().toLowerCase(), filter=$("#libraryFilter").value;
  const list=library.filter(e=>{
    const all=[e.title,e.tags,e.natural,e.nai].join(" ").toLowerCase();
    if(!q) return true;
    if(filter==="tag") return String(e.tags||"").toLowerCase().includes(q);
    if(filter==="nai") return String(e.nai||"").toLowerCase().includes(q);
    return all.includes(q);
  });
  $("#saveList").innerHTML=list.length?list.map(e=>`
    <div class="save-item"><b>${esc(e.title||"未命名")}</b>
    <div class="small">${esc(e.updatedAt||"")}</div>
    <div class="save-tags">${(e.tags||"").split(/[,，]/).filter(Boolean).map(t=>`<span class="save-tag">${esc(t.trim())}</span>`).join("")}</div>
    <div class="small" style="margin-top:8px"><b>自然语言：</b>${esc(e.natural||"未记录")}</div>
    <div class="prompt" style="min-height:0;margin-top:8px;font-size:12px">${esc(e.nai||"未记录")}</div>
    <div class="save-actions">
      <button onclick="loadSave('${e.id}')">载入编辑</button>
      <button onclick="useSave('${e.id}')">载入编译器</button>
      <button class="danger" onclick="deleteSave('${e.id}')">删除</button>
    </div></div>`).join(""):"<div class=\"small\">暂无保存内容。</div>";
}
window.loadSave=id=>{const e=library.find(x=>x.id===id);if(!e)return;editingSave=id;$("#saveTitle").value=e.title||"";$("#saveTags").value=e.tags||"";$("#saveNatural").value=e.natural||"";$("#saveNai").value=e.nai||"";$("#libraryStatus").textContent="正在编辑已保存资料。"};
window.useSave=id=>{const e=library.find(x=>x.id===id);if(!e)return;$("#input").value=e.natural||"";$("#prompt").textContent=e.nai||"等待输入……";showPage("translatePage");$("#status").textContent="已载入："+(e.title||"未命名")};
window.deleteSave=id=>{library=library.filter(x=>x.id!==id);persistLibrary()};
$("#saveEntry").onclick=()=>{
  const title=$("#saveTitle").value.trim()||"未命名";
  const entry={id:editingSave||("p_"+Date.now()),title,tags:$("#saveTags").value.trim(),natural:$("#saveNatural").value.trim(),nai:$("#saveNai").value.trim(),updatedAt:new Date().toLocaleString("zh-CN")};
  if(editingSave){const i=library.findIndex(x=>x.id===editingSave);if(i>=0)library[i]=entry}else library.unshift(entry);
  persistLibrary();$("#libraryStatus").textContent="已保存 ✓";resetSaveForm();
};
$("#clearEntry").onclick=()=>{resetSaveForm();$("#libraryStatus").textContent=""};
$("#librarySearch").oninput=renderLibrary;$("#libraryFilter").onchange=renderLibrary;
$("#saveCurrent").onclick=()=>{
  const natural=$("#input").value.trim(), nai=$("#prompt").textContent==="等待输入……"?"":$("#prompt").textContent;
  $("#saveTitle").value=natural.slice(0,24)||"未命名";
  $("#saveNatural").value=natural; $("#saveNai").value=nai;
  showPage("libraryPage"); renderLibrary(); $("#libraryStatus").textContent="已带入表单，确认后保存。";
};

// ── 自定义词库导入导出 ────────────────────────────────────
function renderCustomVocab(){
  const box=$("#customVocabList");
  if(!customVocabulary.length){box.innerHTML="<div class=\"small\">暂无自定义词条。</div>";return;}
  box.innerHTML=customVocabulary.map(e=>`<div class="import-item"><div><b>${esc(e.canonical_tag)}</b><div class="small">${esc((e.aliases||[]).join(" · ")||"无别名")} · ${esc(CAT_LABEL[e.category]||e.category||"custom")}</div></div></div>`).join("");
}
function normalizeImported(raw){
  let arr=Array.isArray(raw)?raw:(Array.isArray(raw.entries)?raw.entries:(Array.isArray(raw.tags)?raw.tags:[]));
  return arr.map(e=>{
    if(typeof e==="string") return{canonical_tag:e.trim(),aliases:[],category:"custom",related:[],conflicts:[],source:"custom"};
    const tag=String(e.canonical_tag||e.tag||e.name||e.prompt||"").trim();
    if(!tag) return null;
    const aliases=Array.isArray(e.aliases)?e.aliases:(Array.isArray(e.translations)?e.translations:(e.translation?[e.translation]:[]));
    return{canonical_tag:tag,aliases:aliases.map(String).filter(Boolean),category:String(e.category||"custom"),related:[],conflicts:[],source:"custom"};
  }).filter(Boolean);
}
$("#importVocab").onclick=()=>{
  const file=$("#vocabFile").files[0];
  if(!file){$("#importStatus").textContent="请先选择文件。";return;}
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      let imported=[];
      if(/\.(txt|md)$/i.test(file.name)){
        imported=String(reader.result).split(/\r?\n/).map(l=>l.trim()).filter(Boolean)
          .map(l=>l.replace(/^[-*+]\s+/,"").trim())
          .map(l=>{const parts=l.split(/\s*\|\s*|\s*,\s*/);return{canonical_tag:parts[0].trim(),aliases:parts.slice(1).filter(Boolean),category:"custom",related:[],conflicts:[],source:"custom"};})
          .filter(e=>e.canonical_tag);
      }else{
        imported=normalizeImported(JSON.parse(reader.result));
      }
      if(!imported.length) throw new Error("没有识别到词条");
      const map=new Map(customVocabulary.map(e=>[e.canonical_tag,e]));
      imported.forEach(e=>map.set(e.canonical_tag,e));
      customVocabulary=[...map.values()];
      writeJSON(CKEY,customVocabulary);
      renderCustomVocab();renderVocab();
      $("#importStatus").textContent=`已导入 ${imported.length} 条；自定义词库共 ${customVocabulary.length} 条。`;
      $("#vocabFile").value="";
    }catch(e){$("#importStatus").textContent="导入失败，请检查文件格式。";}
  };
  reader.readAsText(file);
};
$("#exportVocab").onclick=()=>{
  const blob=new Blob([JSON.stringify({schema_version:"custom-1.0",entries:customVocabulary},null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="nai-custom-vocabulary.json";a.click();URL.revokeObjectURL(a.href);
};
$("#clearCustomVocab").onclick=()=>{
  if(!customVocabulary.length)return;
  customVocabulary=[];writeJSON(CKEY,[]);renderCustomVocab();renderVocab();
  $("#importStatus").textContent="已清空自定义词库。";
};

// ── 初始化 ────────────────────────────────────────────────
renderChars(); renderMini(); renderSelected(); renderVocab(); renderLibrary(); renderCustomVocab();
$("#status").textContent = `本地词库已就绪：${allVocabulary().length} 条（内置 ${BUILT_IN_VOCAB.length} 条） · 正在连接开源词库…`;
loadOpenSourceVocab().then(info=>{
  renderVocab();
  const total=allVocabulary().length;
  $("#status").textContent=info.count
    ? `词库已就绪：${total} 条（内置 ${BUILT_IN_VOCAB.length} 条 + 开源 ${info.count} 条）`
    : `本地词库已就绪：${total} 条（开源词库暂时无法连接）`;
});
